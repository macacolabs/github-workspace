<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">병합·충돌·중단의 상태 변화</title><desc id="desc">단순히 A나 B를 고르는 문제는 아닙니다. 공통 조상에서 무엇이 달라졌는지 비교하고 합의한 새 결과를 만들어도 됩니다. 공통 조상 · BASE: README: team=base. 두 갈래 변경 · A / B: A: team=A     /     B: team=B. 사람이 결정한 결과 · MERGE: README: team=A+B / 부모는 A와 B</desc><rect width="900" height="530" rx="16" fill="#0d1117"/><text x="38" y="48" fill="#f0f6fc" font-family="sans-serif" font-size="28" font-weight="bold">병합·충돌·중단 · 상태를 위에서 아래로 비교</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker></defs><rect x="38" y="80" width="824" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="60" y="115" font-size="23" font-family="sans-serif" font-weight="bold" fill="#58a6ff">공통 조상 · BASE</text><text x="60" y="160" font-size="23" font-family="sans-serif" fill="#f0f6fc">README: team=base</text><path d="M450 194 V220" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="225" width="824" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="60" y="260" font-size="23" font-family="sans-serif" font-weight="bold" fill="#d29922">두 갈래 변경 · A / B</text><text x="60" y="305" font-size="23" font-family="sans-serif" fill="#f0f6fc">A: team=A     /     B: team=B</text><path d="M450 339 V365" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="370" width="824" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="60" y="405" font-size="23" font-family="sans-serif" font-weight="bold" fill="#3fb950">사람이 결정한 결과 · MERGE</text><text x="60" y="450" font-size="23" font-family="sans-serif" fill="#f0f6fc">README: team=A+B / 부모는 A와 B</text><text x="38" y="515" fill="#aab7c4" font-family="sans-serif" font-size="18">교육용 개념도 · 실제 해시는 저장소마다 다릅니다 · 색과 단계 이름을 함께 읽으세요</text></svg>
