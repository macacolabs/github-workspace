<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="t d"><title id="t">임시 보관과 복원</title><desc id="d">작업 전:notes 수정 + draft 미추적. stash push -u:작업은 보관 목록에 / 작업 트리는 정리. apply → 확인 → drop:파일 복원 → 내용 검증 → 보관 항목 정리</desc><rect width="900" height="530" fill="#0d1117" rx="16"/><rect x="35" y="30" width="830" height="140" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="12"/><text x="55" y="75" font-size="26" fill="#f0f6fc" font-family="sans-serif">1. 작업 전</text><text x="55" y="130" font-size="24" fill="#c9d1d9" font-family="sans-serif">notes 수정 + draft 미추적</text><rect x="35" y="200" width="830" height="140" fill="#161b22" stroke="#d29922" stroke-width="2" rx="12"/><text x="55" y="245" font-size="26" fill="#f0f6fc" font-family="sans-serif">2. stash push -u</text><text x="55" y="300" font-size="24" fill="#c9d1d9" font-family="sans-serif">작업은 보관 목록에 / 작업 트리는 정리</text><rect x="35" y="370" width="830" height="140" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="12"/><text x="55" y="415" font-size="26" fill="#f0f6fc" font-family="sans-serif">3. apply → 확인 → drop</text><text x="55" y="470" font-size="24" fill="#c9d1d9" font-family="sans-serif">파일 복원 → 내용 검증 → 보관 항목 정리</text></svg>
