<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">안전한 충돌 해결 흐름</title><desc id="desc">충돌 발생, status 확인, 충돌 표시 해석, 최종 내용 합의, stage와 commit, 실행 검증의 순서</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f85149"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif}.h{fill:#f0f6fc;font-size:24px;font-weight:700}.s{fill:#8b949e;font-size:13px}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.n{fill:#f85149}.nt{fill:white;font-size:14px;font-weight:700}.p{stroke:#f85149;stroke-width:3;marker-end:url(#a)}.t{fill:#f0f6fc;font-size:15px;font-weight:700}.cmd{fill:#79c0ff;font-size:12px;font-family:Consolas,monospace}</style></defs><rect width="1200" height="430" rx="18" fill="#0d1117"/><text x="48" y="54" class="h">충돌 해결 = 상대 변경 삭제가 아니라 최종 결과 합의</text><text x="48" y="80" class="s">각 단계의 증거를 확인한 뒤 다음 단계로 이동한다</text><g><rect class="box" x="45" y="145" width="160" height="125" rx="14"/><circle class="n" cx="67" cy="168" r="13"/><text class="nt" x="63" y="173">1</text><text class="t" x="63" y="208">충돌 발생</text><text class="cmd" x="63" y="236">merge / pull</text><line class="p" x1="205" y1="207" x2="228" y2="207"/></g><g><rect class="box" x="235" y="145" width="160" height="125" rx="14"/><circle class="n" cx="257" cy="168" r="13"/><text class="nt" x="253" y="173">2</text><text class="t" x="253" y="208">상태 확인</text><text class="cmd" x="253" y="236">git status</text><line class="p" x1="395" y1="207" x2="418" y2="207"/></g><g><rect class="box" x="425" y="145" width="160" height="125" rx="14"/><circle class="n" cx="447" cy="168" r="13"/><text class="nt" x="443" y="173">3</text><text class="t" x="443" y="208">표시 해석</text><text class="cmd" x="443" y="236">ours ↔ theirs</text><line class="p" x1="585" y1="207" x2="608" y2="207"/></g><g><rect class="box" x="615" y="145" width="160" height="125" rx="14"/><circle class="n" cx="637" cy="168" r="13"/><text class="nt" x="633" y="173">4</text><text class="t" x="633" y="208">내용 합의</text><text class="cmd" x="633" y="236">최종 파일 작성</text><line class="p" x1="775" y1="207" x2="798" y2="207"/></g><g><rect class="box" x="805" y="145" width="160" height="125" rx="14"/><circle class="n" cx="827" cy="168" r="13"/><text class="nt" x="823" y="173">5</text><text class="t" x="823" y="208">해결 기록</text><text class="cmd" x="823" y="236">add · commit</text><line class="p" x1="965" y1="207" x2="988" y2="207"/></g><g><rect class="box" x="995" y="145" width="160" height="125" rx="14"/><circle class="n" cx="1017" cy="168" r="13"/><text class="nt" x="1013" y="173">6</text><text class="t" x="1013" y="208">실행 검증</text><text class="cmd" x="1013" y="236">status · test</text></g><rect x="310" y="310" width="580" height="70" rx="10" fill="#2d1618" stroke="#f85149"/><text x="335" y="340" fill="#ff7b72" font-size="15" font-weight="700">금지: 표시만 삭제하고 상대 변경을 확인하지 않는 해결</text><text x="335" y="364" class="s">해결 후 충돌 표시 검색 + 프로그램 실행 + 동료 확인</text></svg>
