<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">원격·분기된 이력의 상태 변화</title><desc id="desc">fetch는 L을 P로 덮지 않습니다. merge가 두 이력을 연결하고 push가 통합된 M을 원격에 전달합니다. 미커밋 notes는 별도로 보존합니다. fetch 전 · 아직 모르는 원격 작업: 로컬 A─L / origin/main=A / 서버 A─P. fetch 후 · 비교만 갱신: 로컬 A─L / origin/main=A─P. merge 후 · 두 부모를 가진 M: L + P → M / push 후 서버와 로컬=M</desc><rect width="900" height="530" rx="16" fill="#0d1117"/><text x="38" y="48" fill="#f0f6fc" font-family="sans-serif" font-size="28" font-weight="bold">원격·분기된 이력 · 상태를 위에서 아래로 비교</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker></defs><rect x="38" y="80" width="824" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="60" y="115" font-size="23" font-family="sans-serif" font-weight="bold" fill="#58a6ff">fetch 전 · 아직 모르는 원격 작업</text><text x="60" y="160" font-size="23" font-family="sans-serif" fill="#f0f6fc">로컬 A─L / origin/main=A / 서버 A─P</text><path d="M450 194 V220" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="225" width="824" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="60" y="260" font-size="23" font-family="sans-serif" font-weight="bold" fill="#d29922">fetch 후 · 비교만 갱신</text><text x="60" y="305" font-size="23" font-family="sans-serif" fill="#f0f6fc">로컬 A─L / origin/main=A─P</text><path d="M450 339 V365" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="370" width="824" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="60" y="405" font-size="23" font-family="sans-serif" font-weight="bold" fill="#3fb950">merge 후 · 두 부모를 가진 M</text><text x="60" y="450" font-size="23" font-family="sans-serif" fill="#f0f6fc">L + P → M / push 후 서버와 로컬=M</text><text x="38" y="515" fill="#aab7c4" font-family="sans-serif" font-size="18">교육용 개념도 · 실제 해시는 저장소마다 다릅니다 · 색과 단계 이름을 함께 읽으세요</text></svg>
