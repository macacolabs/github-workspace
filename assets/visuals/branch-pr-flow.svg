<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">기능 브랜치와 Pull Request 흐름</title><desc id="desc">main에서 기능 브랜치를 만들고 커밋과 push, Pull Request 리뷰를 거쳐 main에 병합하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3fb950"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif}.h{fill:#f0f6fc;font-size:24px;font-weight:700}.s{fill:#8b949e;font-size:14px}.main{stroke:#58a6ff;stroke-width:5}.feat{stroke:#3fb950;stroke-width:5;fill:none}.dotm{fill:#0d1117;stroke:#58a6ff;stroke-width:5}.dotf{fill:#0d1117;stroke:#3fb950;stroke-width:5}.tag{font-size:13px;font-weight:700}.card{fill:#161b22;stroke:#30363d;stroke-width:2}</style></defs><rect width="1200" height="430" rx="18" fill="#0d1117"/><text x="48" y="54" class="h">main은 안정적으로, 기능은 브랜치에서</text><text x="48" y="80" class="s">PR은 코드를 전달하는 버튼이 아니라 변경을 설명하고 검증받는 공간이다</text>
<line class="main" x1="90" y1="205" x2="1110" y2="205"/><path class="feat" d="M270 205C330 205 320 118 390 118H850C930 118 920 205 980 205" marker-end="url(#a)"/>
<circle class="dotm" cx="150" cy="205" r="12"/><text x="108" y="243" fill="#79c0ff" class="tag">main 최신화</text><circle class="dotm" cx="270" cy="205" r="12"/><text x="228" y="243" fill="#79c0ff" class="tag">branch 생성</text><circle class="dotf" cx="430" cy="118" r="12"/><text x="388" y="156" fill="#56d364" class="tag">commit 1</text><circle class="dotf" cx="590" cy="118" r="12"/><text x="548" y="156" fill="#56d364" class="tag">commit 2</text><circle class="dotf" cx="750" cy="118" r="12"/><text x="708" y="156" fill="#56d364" class="tag">push</text><circle class="dotf" cx="870" cy="150" r="12"/><text x="828" y="188" fill="#56d364" class="tag">PR 리뷰</text><circle class="dotm" cx="980" cy="205" r="12"/><text x="938" y="243" fill="#79c0ff" class="tag">merge</text><rect class="card" x="350" y="270" width="500" height="105" rx="12"/><text x="375" y="301" fill="#f0f6fc" font-size="16" font-weight="700">PR 설명 3요소</text><text x="375" y="331" class="s">목적: 무엇을 해결했는가?</text><text x="580" y="331" class="s">변경: 무엇이 바뀌었는가?</text><text x="375" y="358" class="s">검증: 무엇을 실행하고 확인했는가?</text></svg>
