<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">revert·stash·reflog의 상태 변화</title><desc id="desc">내용이 이전처럼 보인다는 것과 이력이 이전으로 이동했다는 것은 다릅니다. R은 취소를 기록한 새로운 커밋입니다. 취소 전 · 공유된 이력: A (base) ── B (wrong, shared). revert · 반대 변경 새로 기록: A ── B ── R (HEAD). 검증 · 내용과 이력을 따로 확인: 파일=base / B는 여전히 R의 조상</desc><rect width="900" height="530" rx="16" fill="#0d1117"/><text x="38" y="48" fill="#f0f6fc" font-family="sans-serif" font-size="28" font-weight="bold">revert·stash·reflog · 상태를 위에서 아래로 비교</text><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#58a6ff" stroke="none"/></marker></defs><rect x="38" y="80" width="824" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="60" y="115" font-size="23" font-family="sans-serif" font-weight="bold" fill="#58a6ff">취소 전 · 공유된 이력</text><text x="60" y="160" font-size="23" font-family="sans-serif" fill="#f0f6fc">A (base) ── B (wrong, shared)</text><path d="M450 194 V220" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="225" width="824" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="60" y="260" font-size="23" font-family="sans-serif" font-weight="bold" fill="#d29922">revert · 반대 변경 새로 기록</text><text x="60" y="305" font-size="23" font-family="sans-serif" fill="#f0f6fc">A ── B ── R (HEAD)</text><path d="M450 339 V365" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="370" width="824" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="60" y="405" font-size="23" font-family="sans-serif" font-weight="bold" fill="#3fb950">검증 · 내용과 이력을 따로 확인</text><text x="60" y="450" font-size="23" font-family="sans-serif" fill="#f0f6fc">파일=base / B는 여전히 R의 조상</text><text x="38" y="515" fill="#aab7c4" font-family="sans-serif" font-size="18">교육용 개념도 · 실제 해시는 저장소마다 다릅니다 · 색과 단계 이름을 함께 읽으세요</text></svg>
