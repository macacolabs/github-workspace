<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">브랜치·HEAD의 상태 변화</title><desc id="desc">B 커밋은 삭제하지 않습니다. feature 이름을 붙여 보존한 뒤 main 참조만 A로 이동합니다. 공유된 브랜치에는 별도 팀 판단이 필요합니다. 처음 · main에서 실수로 커밋: A (practice-base) ── B (main, HEAD). 먼저 보존 · 새 이름 생성: A ── B (main, feature/rescued, HEAD). 미공유 main만 기준으로 이동: A (main) ── B (feature/rescued, HEAD)</desc><rect width="900" height="530" rx="16" fill="#0d1117"/><text x="38" y="48" fill="#f0f6fc" font-family="sans-serif" font-size="28" font-weight="bold">브랜치·HEAD · 상태를 위에서 아래로 비교</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker></defs><rect x="38" y="80" width="824" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="60" y="115" font-size="23" font-family="sans-serif" font-weight="bold" fill="#58a6ff">처음 · main에서 실수로 커밋</text><text x="60" y="160" font-size="23" font-family="sans-serif" fill="#f0f6fc">A (practice-base) ── B (main, HEAD)</text><path d="M450 194 V220" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="225" width="824" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="60" y="260" font-size="23" font-family="sans-serif" font-weight="bold" fill="#d29922">먼저 보존 · 새 이름 생성</text><text x="60" y="305" font-size="23" font-family="sans-serif" fill="#f0f6fc">A ── B (main, feature/rescued, HEAD)</text><path d="M450 339 V365" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="370" width="824" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="60" y="405" font-size="23" font-family="sans-serif" font-weight="bold" fill="#3fb950">미공유 main만 기준으로 이동</text><text x="60" y="450" font-size="23" font-family="sans-serif" fill="#f0f6fc">A (main) ── B (feature/rescued, HEAD)</text><text x="38" y="515" fill="#aab7c4" font-family="sans-serif" font-size="18">교육용 개념도 · 실제 해시는 저장소마다 다릅니다 · 색과 단계 이름을 함께 읽으세요</text></svg>
