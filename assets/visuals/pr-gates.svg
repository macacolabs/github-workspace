<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="t d"><title id="t">PR의 세 가지 확인 단계</title><desc id="d">main과 feature 비교, 리뷰와 테스트, 승인 후 병합 순서. 단계별 기준과 결과를 모두 확인한다.</desc><rect width="900" height="530" rx="16" fill="#0d1117"/><rect x="35" y="25" width="830" height="145" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="58" y="65" fill="#f0f6fc" font-family="sans-serif" font-size="28">1. 기준 확인</text><text x="58" y="105" fill="#f0f6fc" font-family="sans-serif" font-size="25">base=main ← head=feature</text><text x="58" y="145" fill="#aab7c4" font-family="sans-serif" font-size="23">공통 조상 이후 변경 범위를 읽기</text><rect x="35" y="195" width="830" height="145" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="58" y="235" fill="#f0f6fc" font-family="sans-serif" font-size="28">2. 내용 검증</text><text x="58" y="275" fill="#f0f6fc" font-family="sans-serif" font-size="25">파일 diff + 리뷰 + 프로그램 테스트</text><text x="58" y="315" fill="#aab7c4" font-family="sans-serif" font-size="23">충돌 없음 ≠ 기능 정상</text><rect x="35" y="365" width="830" height="145" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="58" y="405" fill="#f0f6fc" font-family="sans-serif" font-size="28">3. 승인 후 병합</text><text x="58" y="445" fill="#f0f6fc" font-family="sans-serif" font-size="25">리뷰 반영 → 재검증 → main 최신화</text><text x="58" y="485" fill="#aab7c4" font-family="sans-serif" font-size="23">공유 이력과 동료 작업을 보존</text></svg>
