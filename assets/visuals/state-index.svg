<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">상태·스테이징의 상태 변화</title><desc id="desc">위에서 아래로 읽으세요. 세 영역의 README 내용은 동시에 다를 수 있습니다. add는 작업 트리→index, commit은 index→새 커밋입니다. HEAD · 마지막 커밋: README: base / notes: base. INDEX · 다음 커밋 후보: README: profile / notes: unrelated. WORKTREE · 편집기: README: profile-v2 / draft: keep</desc><rect width="900" height="530" rx="16" fill="#0d1117"/><text x="38" y="48" fill="#f0f6fc" font-family="sans-serif" font-size="28" font-weight="bold">상태·스테이징 · 상태를 위에서 아래로 비교</text><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#58a6ff" stroke="none"/></marker></defs><rect x="38" y="80" width="824" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="60" y="115" font-size="23" font-family="sans-serif" font-weight="bold" fill="#58a6ff">HEAD · 마지막 커밋</text><text x="60" y="160" font-size="23" font-family="sans-serif" fill="#f0f6fc">README: base / notes: base</text><path d="M450 220 V194" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="214" fill="#f0f6fc" font-family="sans-serif" font-size="18">commit → 새 커밋 생성</text><rect x="38" y="225" width="824" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="60" y="260" font-size="23" font-family="sans-serif" font-weight="bold" fill="#d29922">INDEX · 다음 커밋 후보</text><text x="60" y="305" font-size="23" font-family="sans-serif" fill="#f0f6fc">README: profile / notes: unrelated</text><path d="M450 365 V339" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="359" fill="#f0f6fc" font-family="sans-serif" font-size="18">add → 현재 파일 내용 기록</text><rect x="38" y="370" width="824" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="60" y="405" font-size="23" font-family="sans-serif" font-weight="bold" fill="#3fb950">WORKTREE · 편집기</text><text x="60" y="450" font-size="23" font-family="sans-serif" fill="#f0f6fc">README: profile-v2 / draft: keep</text><text x="38" y="515" fill="#aab7c4" font-family="sans-serif" font-size="18">교육용 개념도 · 실제 해시는 저장소마다 다릅니다 · 색과 단계 이름을 함께 읽으세요</text></svg>
