<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="t d"><title id="t">커밋 분실과 참조 복구</title><desc id="d">detached HEAD:A ── B / HEAD는 B를 직접 가리킴. main으로 이동:HEAD → main → A / B의 브랜치 이름 없음. reflog로 찾아 이름 붙이기:rescue/recovered → B / B 내용을 보존</desc><rect width="900" height="530" fill="#0d1117" rx="16"/><rect x="35" y="30" width="830" height="140" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="12"/><text x="55" y="75" font-size="26" fill="#f0f6fc" font-family="sans-serif">1. detached HEAD</text><text x="55" y="130" font-size="24" fill="#c9d1d9" font-family="sans-serif">A ── B / HEAD는 B를 직접 가리킴</text><rect x="35" y="200" width="830" height="140" fill="#161b22" stroke="#d29922" stroke-width="2" rx="12"/><text x="55" y="245" font-size="26" fill="#f0f6fc" font-family="sans-serif">2. main으로 이동</text><text x="55" y="300" font-size="24" fill="#c9d1d9" font-family="sans-serif">HEAD → main → A / B의 브랜치 이름 없음</text><rect x="35" y="370" width="830" height="140" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="12"/><text x="55" y="415" font-size="26" fill="#f0f6fc" font-family="sans-serif">3. reflog로 찾아 이름 붙이기</text><text x="55" y="470" font-size="24" fill="#c9d1d9" font-family="sans-serif">rescue/recovered → B / B 내용을 보존</text></svg>
