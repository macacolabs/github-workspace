<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Git의 세 영역과 확인 명령</title><desc id="desc">Working Tree, Staging Area, Repository 사이에서 add, commit, restore가 이동하는 흐름</desc><defs><marker id="a" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#58a6ff" stroke="none"/></marker><marker id="r" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#f85149" stroke="none"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif}.box{fill:#161b22;stroke-width:2}.h{fill:#f0f6fc;font-size:21px;font-weight:700}.s{fill:#8b949e;font-size:14px}.cmd{fill:#79c0ff;font-size:15px;font-family:Consolas,monospace}.f{fill:#3fb950;font-size:14px}.go{stroke:#58a6ff;stroke-width:3;marker-end:url(#a)}.back{stroke:#f85149;stroke-width:2;marker-end:url(#r)}</style></defs><rect width="1200" height="430" rx="18" fill="#0d1117"/><text x="48" y="54" class="h" font-size="25">변경은 어디에 있는가?</text><text x="48" y="80" class="s">명령 전후에 status와 diff로 위치를 확인한다</text>
<rect class="box" x="55" y="125" width="290" height="215" rx="16" stroke="#58a6ff"/><text class="h" x="82" y="168">Working Tree</text><text class="s" x="82" y="194">내가 편집 중인 파일</text><text class="f" x="82" y="238">● README.md modified</text><text class="cmd" x="82" y="292">git diff</text><text class="s" x="82" y="316">아직 stage하지 않은 변경</text>
<rect class="box" x="455" y="125" width="290" height="215" rx="16" stroke="#d29922"/><text class="h" x="482" y="168">Staging Area</text><text class="s" x="482" y="194">다음 커밋에 넣을 변경</text><text class="f" x="482" y="238">● README.md staged</text><text class="cmd" x="482" y="292">git diff --staged</text><text class="s" x="482" y="316">커밋 직전 최종 검토</text>
<rect class="box" x="855" y="125" width="290" height="215" rx="16" stroke="#3fb950"/><text class="h" x="882" y="168">Repository</text><text class="s" x="882" y="194">커밋으로 기록된 이력</text><text class="f" x="882" y="238">● a1b2c3d feat: profile</text><text class="cmd" x="882" y="292">git log --oneline</text><text class="s" x="882" y="316">누가 무엇을 왜 바꿨는지</text>
<line class="go" x1="353" y1="205" x2="445" y2="205"/><text class="cmd" x="365" y="190">git add</text><line class="go" x1="753" y1="205" x2="845" y2="205"/><text class="cmd" x="760" y="190">git commit</text><path class="back" d="M447 262H355"/><text x="360" y="285" fill="#ff7b72" font-size="12">restore --staged</text></svg>
